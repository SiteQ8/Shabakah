# Shabakah lab DNS resolver.
# A tiny, offline authoritative-ish resolver so the DNS lesson has real
# records to query. It listens on loopback only and never forwards anywhere.

port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
log-queries

# A records for the lab zone
host-record=web.shabakah.lab,10.13.37.10
host-record=mail.shabakah.lab,10.13.37.20
host-record=db.shabakah.lab,10.13.37.30
host-record=vpn.shabakah.lab,10.13.37.40

# MX and TXT so the learner can practise more than A lookups
mx-host=shabakah.lab,mail.shabakah.lab,10
txt-record=shabakah.lab,"owner=siteq8 env=lab"
txt-record=shabakah.lab,"v=lab1 note=practice-zone"
